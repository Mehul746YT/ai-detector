<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AI Detector — Dutton &amp; Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #111009;
      --surface:   #1c1a12;
      --surface2:  #252318;
      --border:    #3a3420;
      --accent:    #c9a227;
      --accent-dk: #a07e18;
      --accent-lt: #e6bf55;
      --red:       #c0392b;
      --green:     #4a8c4a;
      --yellow:    #c9a227;
      --text:      #f8f5ed;
      --muted:     #a89a7a;
      --r:         8px;
      --font-serif:'Playfair Display', Georgia, serif;
      --font-sans: 'Inter', system-ui, sans-serif;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 32px 16px 72px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 36px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }
    .logo-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 6px;
    }
    .logo-d {
      font-family: var(--font-serif);
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .logo-divider {
      width: 1px;
      height: 36px;
      background: var(--border);
    }
    header h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
    }
    header h1 span { color: var(--accent); }
    header p {
      font-family: var(--font-sans);
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .brand-line {
      font-family: var(--font-serif);
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .brand-line span { color: var(--accent); }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 10px;
      max-width: 680px;
      margin: 0 auto 24px;
    }
    .tab {
      flex: 1;
      padding: 11px 16px;
      border-radius: var(--r);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-family: var(--font-serif);
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 0.03em;
      transition: all 0.2s;
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #111009;
      font-weight: 700;
    }
    .tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }

    /* ── Panels ── */
    .panel { display: none; max-width: 680px; margin: 0 auto; }
    .panel.active { display: block; }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 22px;
      margin-bottom: 16px;
    }
    .card-label {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
      display: block;
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }

    /* ── Textarea ── */
    textarea {
      width: 100%;
      min-height: 160px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.93rem;
      line-height: 1.65;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: #6b5f45; }

    .meta { display:flex; gap:14px; margin-top:8px; color:var(--muted); font-size:0.78rem; }

    /* ── Button ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 24px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #111009;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 14px;
    }
    .btn:hover { background: var(--accent-lt); border-color: var(--accent-lt); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--r);
      padding: 38px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone.over { border-color: var(--accent); background: #1c1a08; }
    .drop-zone input { display: none; }
    .drop-icon { font-size: 2.6rem; margin-bottom: 10px; }
    .drop-zone p { color: var(--muted); font-size: 0.85rem; }
    .drop-zone strong { color: var(--text); }

    .preview-grid { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
    .preview-item {
      position: relative; width:88px; height:88px;
      border-radius: 6px; overflow:hidden; border:1px solid var(--border);
    }
    .preview-item img { width:100%; height:100%; object-fit:cover; }
    .preview-item .rm {
      position:absolute; top:3px; right:3px;
      background:rgba(0,0,0,.8); border:none; color:var(--accent);
      border-radius:50%; width:18px; height:18px; cursor:pointer;
      font-size:11px; display:flex; align-items:center; justify-content:center;
    }

    /* ── Results ── */
    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 22px;
      margin-bottom: 14px;
      animation: fadeIn 0.35s ease;
    }
    .result-card:hover { border-color: #4a3e1a; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

    .result-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .result-title {
      font-family: var(--font-serif);
      font-weight: 600;
      font-size: 1rem;
      color: var(--text);
    }
    .result-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

    .verdict {
      padding: 5px 14px;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .verdict-ai    { background:#2a0f0f; color:#e05252; border:1px solid #5a1a1a; }
    .verdict-human { background:#0d1f0d; color:#6abf69; border:1px solid #1a4a1a; }
    .verdict-mixed { background:#1e1805; color:#c9a227; border:1px solid #4a3a10; }

    /* ── Probability bar ── */
    .bar-wrap { margin-bottom: 18px; }
    .bar-label {
      display: flex; justify-content: space-between;
      font-size: 0.78rem; color: var(--muted); margin-bottom: 6px;
      font-family: var(--font-sans); letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .bar {
      height: 6px; border-radius: 999px;
      background: var(--surface2); overflow: hidden;
    }
    .bar-fill { height:100%; border-radius:999px; transition:width .8s cubic-bezier(.4,0,.2,1); }

    /* ── Signals ── */
    .signals-label {
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 16px 0 10px;
    }
    .signals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    @media(max-width:500px) { .signals { grid-template-columns: 1fr; } }

    .sig {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 11px 12px;
    }
    .sig-name {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }
    .sig-val { font-size: 0.88rem; font-weight: 700; }
    .sig-lbl { font-size: 0.7rem; color: var(--muted); margin-top: 2px; line-height: 1.4; }
    .sig-bar {
      height: 3px; border-radius:999px;
      background: var(--border); margin-top:7px; overflow:hidden;
    }
    .sig-bar-fill { height:100%; border-radius:999px; }

    /* ── Tip box ── */
    .tip {
      background: #171408;
      border-left: 2px solid var(--accent);
      border-radius: 0 6px 6px 0;
      padding: 10px 14px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 16px;
      line-height: 1.55;
    }

    /* ── PPL badge ── */
    .ppl-badge {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 14px;
      font-family: var(--font-sans);
    }
    .ppl-badge b { color: var(--accent); }

    /* ── Loader ── */
    .loader {
      text-align: center; padding: 36px;
      color: var(--muted); font-size: 0.88rem;
      font-family: var(--font-sans);
    }
    .spinner {
      display: inline-block; width:26px; height:26px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .75s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .img-thumb {
      width:56px; height:56px; border-radius:6px;
      object-fit:cover; border:1px solid var(--border);
    }
    .err { color: var(--red); font-size:.85rem; margin-top:8px; }

    /* ── Divider ── */
    .gold-rule {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }
  </style>
</head>
<body>

<header>
  <div class="logo-line">
    <span class="logo-d">D</span>
    <div class="logo-divider"></div>
    <h1><span>AI</span> Detector</h1>
  </div>
  <p>Multi-signal detection · Text &amp; Images · Real ML Models</p>
  <div class="brand-line">A <span>Dutton &amp; Co.</span> Tool</div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('text')">📝 Text Analysis</div>
  <div class="tab" onclick="switchTab('image')">🖼️ Image Analysis</div>
</div>

<!-- TEXT PANEL -->
<div class="panel active" id="panel-text">
  <div class="card">
    <label class="card-label">Paste text to analyse</label>
    <textarea id="textInput" placeholder="Paste any text — essay, email, article, social post, etc. Minimum 20 words for reliable results."></textarea>
    <div class="meta">
      <span id="wc">0 words</span>
      <span id="cc">0 characters</span>
    </div>
    <button class="btn" id="textBtn" onclick="analyzeText()">🔍 Analyse Text</button>
  </div>
  <div id="textResults"></div>
</div>

<!-- IMAGE PANEL -->
<div class="panel" id="panel-image">
  <div class="card">
    <label class="card-label">Upload images to analyse</label>
    <div class="drop-zone" id="dz" onclick="document.getElementById('fi').click()">
      <input type="file" id="fi" accept="image/*" multiple onchange="handleFiles(this.files)"/>
      <div class="drop-icon">🖼️</div>
      <p><strong>Click or drag &amp; drop images here</strong></p>
      <p style="margin-top:4px">JPG &nbsp;·&nbsp; PNG &nbsp;·&nbsp; WebP &nbsp;·&nbsp; BMP &nbsp;·&nbsp; TIFF</p>
    </div>
    <div class="preview-grid" id="pg"></div>
    <button class="btn" id="imgBtn" onclick="analyzeImages()" style="display:none">🔍 Analyse Images</button>
  </div>
  <div id="imgResults"></div>
</div>

<script>
// ── Tab switching ─────────────────────────────────────────────────────────
function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el, i) =>
    el.classList.toggle('active', (i===0&&t==='text')||(i===1&&t==='image'))
  );
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + t).classList.add('active');
}

// ── Word count ────────────────────────────────────────────────────────────
document.getElementById('textInput').addEventListener('input', function() {
  const w = this.value.trim().split(/\s+/).filter(Boolean).length;
  document.getElementById('wc').textContent = w + ' words';
  document.getElementById('cc').textContent = this.value.length + ' characters';
});

// ── Drag & drop ───────────────────────────────────────────────────────────
const dz = document.getElementById('dz');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); handleFiles(e.dataTransfer.files); });

let imgFiles = [];
function handleFiles(files) {
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    if (imgFiles.find(x => x.name === f.name && x.size === f.size)) continue;
    imgFiles.push(f);
  }
  renderPreviews();
}
function removeFile(i) { imgFiles.splice(i, 1); renderPreviews(); }
function renderPreviews() {
  const pg = document.getElementById('pg');
  pg.innerHTML = '';
  imgFiles.forEach((f, i) => {
    const url = URL.createObjectURL(f);
    const d = document.createElement('div');
    d.className = 'preview-item';
    d.innerHTML = `<img src="${url}"><button class="rm" onclick="removeFile(${i})">✕</button>`;
    pg.appendChild(d);
  });
  document.getElementById('imgBtn').style.display = imgFiles.length ? 'inline-flex' : 'none';
}

// ── Colour helpers ────────────────────────────────────────────────────────
function barColor(pct) {
  return pct >= 65 ? '#c0392b' : pct >= 40 ? '#c9a227' : '#4a8c4a';
}

// ── TEXT analysis ─────────────────────────────────────────────────────────
async function analyzeText() {
  const text = document.getElementById('textInput').value.trim();
  if (!text) { alert('Please paste some text first.'); return; }
  const btn = document.getElementById('textBtn');
  btn.disabled = true;
  document.getElementById('textResults').innerHTML =
    `<div class="loader"><div class="spinner"></div><br>Running ML models… first run downloads models (~30s)</div>`;
  try {
    const resp = await fetch('/analyze/text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await resp.json();
    if (data.error) {
      document.getElementById('textResults').innerHTML =
        `<div class="card err">❌ ${data.error}</div>`;
      return;
    }
    document.getElementById('textResults').innerHTML = renderTextResult(data);
  } catch(e) {
    document.getElementById('textResults').innerHTML =
      `<div class="card err">❌ Server error: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function renderTextResult(d) {
  const pct = Math.round(d.final_score * 100);
  const bc  = barColor(pct);
  const vc  = pct >= 65 ? 'verdict-ai' : pct >= 40 ? 'verdict-mixed' : 'verdict-human';
  const pplHtml = d.perplexity
    ? `<div class="ppl-badge">GPT-2 Perplexity: <b>${d.perplexity}</b> — ${
        d.perplexity < 80 ? 'AI-predictable (low)' :
        d.perplexity < 150 ? 'borderline' : 'human-varied (high)'
      }</div>`
    : '';
  const sigs = (d.signals || []).map(sigHtml).join('');
  const tip  = pct >= 65
    ? 'Multiple ML signals agree — this text shows strong AI authorship characteristics.'
    : pct >= 40
    ? 'Mixed signals detected. Could be human-edited AI output or formal human writing.'
    : 'Low AI probability across all signals. Likely human-authored text.';

  return `<div class="result-card">
    <div class="result-header">
      <div style="flex:1">
        <div class="result-title">Text Analysis</div>
        <div class="result-sub">${d.word_count} words analysed</div>
      </div>
      <div class="verdict ${vc}">${d.verdict}</div>
    </div>
    <div class="bar-wrap">
      <div class="bar-label">
        <span>AI Probability</span>
        <span style="color:${bc};font-weight:700">${pct}%</span>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${bc}"></div></div>
    </div>
    ${pplHtml}
    <div class="signals-label">Signal Breakdown</div>
    <div class="signals">${sigs}</div>
    <div class="tip">💡 ${tip}</div>
  </div>`;
}

// ── IMAGE analysis ────────────────────────────────────────────────────────
async function analyzeImages() {
  if (!imgFiles.length) return;
  const btn = document.getElementById('imgBtn');
  btn.disabled = true;
  document.getElementById('imgResults').innerHTML =
    `<div class="loader"><div class="spinner"></div><br>Analysing ${imgFiles.length} image(s)… ViT model loads on first run</div>`;
  const results = [];
  for (const f of imgFiles) {
    const fd = new FormData();
    fd.append('file', f);
    try {
      const resp = await fetch('/analyze/image', { method: 'POST', body: fd });
      const data = await resp.json();
      results.push({ data, url: URL.createObjectURL(f), name: f.name, size: f.size });
    } catch(e) {
      results.push({ error: e.message, name: f.name });
    }
  }
  btn.disabled = false;
  document.getElementById('imgResults').innerHTML = results.map(r =>
    r.error
      ? `<div class="card err">❌ ${r.name}: ${r.error}</div>`
      : renderImgResult(r)
  ).join('');
}

function renderImgResult({ data, url, name, size }) {
  const pct = Math.round(data.final_score * 100);
  const bc  = barColor(pct);
  const vc  = pct >= 65 ? 'verdict-ai' : pct >= 40 ? 'verdict-mixed' : 'verdict-human';
  const sigs = (data.signals || []).map(sigHtml).join('');
  const tip  = pct >= 65
    ? 'High AI probability — ViT model and/or metadata fingerprint confirm AI origin.'
    : pct >= 40
    ? 'Mixed signals. Could be an edited AI image or an unusual real photograph.'
    : 'Low AI probability — real camera EXIF, natural noise, and/or model classifies as real.';

  return `<div class="result-card">
    <div class="result-header">
      <img src="${url}" class="img-thumb"/>
      <div style="flex:1;margin-left:4px">
        <div class="result-title" style="font-size:.9rem">${name}</div>
        <div class="result-sub">${(size/1024).toFixed(0)} KB</div>
      </div>
      <div class="verdict ${vc}">${data.verdict}</div>
    </div>
    <div class="bar-wrap">
      <div class="bar-label">
        <span>AI Probability</span>
        <span style="color:${bc};font-weight:700">${pct}%</span>
      </div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${bc}"></div></div>
    </div>
    <div class="signals-label">Signal Breakdown</div>
    <div class="signals">${sigs}</div>
    <div class="tip">💡 ${tip}</div>
  </div>`;
}

function sigHtml(s) {
  const pct = Math.round(s.ai_score * 100);
  const col = barColor(pct);
  return `<div class="sig">
    <div class="sig-name">${s.name}</div>
    <div class="sig-val" style="color:${col}">${pct}% AI</div>
    <div class="sig-lbl">${s.label || ''}</div>
    <div class="sig-bar"><div class="sig-bar-fill" style="width:${pct}%;background:${col}"></div></div>
  </div>`;
}
</script>
</body>
</html>
